<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>The Arena — Flashpoint History</title>
    <meta name="description" content="The Arena — train the exact skills the Regents tests, on your own time. A Flashpoint History skills trainer." />

    <!-- Home-screen icon: the Arena's own front door (frontdoor-v2.webp), square-cropped on the
         entrance. BK, 2026-10-31: use the live exterior image as-is, not a drawn mark. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0B1220" />

    <!-- The Arena is reached by link, never by search (CJ's pass 2026-10-16; BK's ruling). The same
         instruction is sent as a response header in public/_headers, and public/robots.txt explains
         why crawling stays open: a crawler must fetch the page to see this tag. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Arena sub-brand fonts: Barlow Condensed (display) + Outfit (body). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
